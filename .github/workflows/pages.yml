name: Publicar pagina de convites
on:
  push:
    branches: [main]
    paths: ['site/invite/**', 'site/icon.svg', 'site/invite-icon.png', 'site/invite-preview.png', 'site/pages-root.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # Only the invite lives on Pages; the landing is on Vercel and the root redirects there.
      - run: |
          mkdir _pages
          cp -r site/invite site/icon.svg site/invite-icon.png site/invite-preview.png _pages/
          cp site/pages-root.html _pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v5
